[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senda-backend"
version = "0.1.0"
description = "SENDA - Martian EVA planning API (hexagonal architecture)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
quantum = ["qiskit>=1.2", "qiskit-ibm-runtime>=0.29", "qiskit-aer>=0.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
